<html lang="zh-Hant"><head><meta charset="utf-8">

<style>
:root{--ink:#3b2342;--pink:#ff5c8a;--sun:#ffd23f}

<div class="scr hide" id="menu">

<li>左右滑動換道、上滑跳躍（電腦：←→ 與空白鍵）</li>

  else if(s=='perm'){c.beginPath();c.moveTo(X(-.96),Y(.05));c.bezierCurveTo(X(-1.08),Y(-.8),X(-.6),Y(-1.1),x,Y(-1.05));c.bezierCurveTo(X(.6),Y(-1.1),X(1.08),Y(-.8),X(.96),Y(.05));

    {const n=5,yb=u=>-.36-.16*(1-Math.min(1,(u/.86)**2));for(let i=0;i<n;i++){const a=.84-i*1.68/n,b=.84-(i+1)*1.68/n;c.quadraticCurveTo(X((a+b)/2),Y(yb((a+b)/2)+.24),X(b),Y(yb(b)))}}

    c.strokeStyle='rgba(185,125,105,.75)';c.lineWidth=r*.06;c.lineCap='round';c.beginPath();c.moveTo(X(-.72),Y(-.72));c.quadraticCurveTo(X(-.6),Y(-.95),X(-.4),Y(-.86));c.quadraticCurveTo(X(-.25),Y(-.97),X(-.05),Y(-.88));c.stroke()}
  else{c.beginPath();c.ellipse(x,Y(-.08),r,r,0,Math.PI,2*Math.PI);c.fill();

/* ---------- jogging figure ---------- */
function person(c,x,y,U,h,t,jy,face,ex,sd){sd=sd||1;
  const ph=t*11,air=jy>0,jh=jy*42*U,by=y-jh-(air?0:Math.abs(Math.sin(ph))*3*U);
  c.fillStyle='rgba(0,0,0,.25)';c.beginPath();c.ellipse(x,y,26*U*(1-jy*.12),8*U,0,0,7);c.fill();
  c.lineCap=c.lineJoin='round';
  [[-1,0],[1,Math.PI]].forEach(([d,o])=>{const lift=air?(d<0?13:4)*U:Math.max(0,Math.sin(ph+o))*16*U,hx=x+d*8*U,fy=y-jh-3*U-lift;
